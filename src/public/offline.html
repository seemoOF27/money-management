<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - إدارة الأموال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        
        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon svg {
            width: 50px;
            height: 50px;
            color: white;
        }
        
        h1 {
            color: #059669;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .button {
            background: #10b981;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #059669;
        }
        
        .features {
            margin-top: 30px;
            text-align: right;
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
        }
        
        .features h3 {
            color: #374151;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .features ul {
            list-style: none;
        }
        
        .features li {
            color: #6b7280;
            padding: 5px 0;
            font-size: 14px;
        }
        
        .features li::before {
            content: "✓ ";
            color: #10b981;
            font-weight: bold;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3"></path>
            </svg>
        </div>
        
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>لا يمكن الوصول إلى التطبيق الآن. يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى.</p>
        
        <button class="button" onclick="window.location.reload()">إعادة المحاولة</button>
        
        <div class="features">
            <h3>💡 ملاحظة</h3>
            <ul>
                <li>تأكد من اتصالك بالإنترنت</li>
                <li>بعد تسجيل الدخول، يمكنك استخدام البيانات المحفوظة محلياً</li>
                <li>التطبيق يعمل بدون اتصال بعد التحميل الأول</li>
            </ul>
        </div>
    </div>
</body>
</html>
