<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنت غير متصل بالإنترنت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #d1fae5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }
        
        .icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h1 {
            color: #059669;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        p {
            color: #6b7280;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .retry-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .retry-btn:hover {
            background: #047857;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
        }
        
        .status {
            margin-top: 30px;
            padding: 15px;
            background: #f0fdf4;
            border-radius: 10px;
            color: #065f46;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </div>
        
        <h1>أنت غير متصل بالإنترنت</h1>
        
        <p>
            للأسف، لا يمكن الوصول إلى التطبيق حالياً لأنك غير متصل بالإنترنت.
            يرجى التحقق من اتصالك والمحاولة مرة أخرى.
        </p>
        
        <button class="retry-btn" onclick="location.reload()">
            إعادة المحاولة
        </button>
        
        <div class="status" id="status">
            التحقق من الاتصال...
        </div>
    </div>
    
    <script>
        function checkConnection() {
            const status = document.getElementById('status');
            
            if (navigator.onLine) {
                status.textContent = '✓ الاتصال متاح الآن. انقر على "إعادة المحاولة"';
                status.style.background = '#d1fae5';
                status.style.color = '#065f46';
            } else {
                status.textContent = '✗ لا يوجد اتصال بالإنترنت';
                status.style.background = '#fee2e2';
                status.style.color = '#991b1b';
            }
        }
        
        // Check connection status every 3 seconds
        setInterval(checkConnection, 3000);
        checkConnection();
        
        // Listen for online/offline events
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);
    </script>
</body>
</html>
