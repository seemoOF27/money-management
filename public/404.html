<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>إدارة الأموال الشخصية - Personal Finance PWA</title>
    <meta name="title" content="إدارة الأموال الشخصية" />
    <meta name="description" content="تطبيق ويب متقدم لإدارة الأموال والميزانيات الشخصية مع دعم الديون والاستثمارات" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="إدارة الأموال" />
    
    <!-- SPA GitHub Pages Fix -->
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Store the path when 404 occurs
      sessionStorage.redirect = location.href;
    </script>
    
    <!-- Manifest -->
    <link rel="manifest" href="/money-management/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/money-management/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/money-management/icon-512.png" />
    <link rel="apple-touch-icon" href="/money-management/icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/money-management/icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/money-management/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/money-management/icon-512.png" />
    
    <!-- iOS Splash Screens -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Redirect to index.html -->
    <meta http-equiv="refresh" content="0;URL='/money-management/'">
</head>
<body>
    <script>
      // Redirect to index.html immediately
      window.location.replace('/money-management/' + window.location.pathname.replace('/money-management/', '').replace(/^\//, ''));
    </script>
</body>
</html>
